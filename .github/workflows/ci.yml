name: AuroraPIC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / openmp=${{ matrix.openmp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            openmp: ON
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            openmp: OFF
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
            openmp: OFF

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_ENABLE_OPENMP=${{ matrix.openmp }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Validate milestone and release metadata
        run: |
          python3 scripts/validate_milestones.py
          python3 scripts/validate_hall_case.py
          python3 scripts/validate_release_artifacts.py

      - name: Validate LXCat importer
        run: python3 scripts/test_import_lxcat.py

      - name: Validate electron-swarm CLI
        run: python3 scripts/test_swarm_cli.py build/aurorapic_swarm

      - name: Validate swarm reference comparison
        run: python3 scripts/test_compare_swarm.py

      - name: Validate serialized swarm campaigns
        run: python3 scripts/test_swarm_campaign.py

      - name: Validate Hall comparison and preflight
        run: python3 scripts/test_hall_comparison.py
      - name: Validate Hall seeded ensembles
        run: python3 scripts/test_hall_ensemble.py
      - name: Validate Hall convergence workflow
        run: python3 scripts/test_hall_convergence.py build/aurorapic_cli
      - name: Validate Hall flux stationarity analysis
        run: python3 scripts/test_hall_flux_stationarity.py
      - name: Validate Hall flux block comparison
        run: python3 scripts/test_hall_flux_block_comparison.py
      - name: Validate Hall horizon workflow
        run: python3 scripts/test_hall_horizon_stage.py build/aurorapic_cli
      - name: Validate Hall external source lock
        run: python3 scripts/test_lock_hall_source.py
      - name: Validate Turner publisher supplement
        run: python3 scripts/test_verify_turner_source.py
      - name: Validate Turner supplement normalization
        run: python3 scripts/test_normalize_turner_source.py
      - name: Validate Turner production campaign preparation
        run: python3 scripts/test_prepare_turner_case.py
      - name: Validate bounded Turner runtime qualification
        run: python3 scripts/test_turner_runtime_qualification.py build/aurorapic_cli
      - name: Validate Turner one-cycle startup workflow
        run: python3 scripts/test_turner_startup.py
      - name: Validate bounded Turner horizon workflow
        run: python3 scripts/test_turner_horizon.py
      - name: Validate Turner stationarity screening
        run: python3 scripts/test_turner_stationarity.py
      - name: Validate Turner ion-density comparison
        run: python3 scripts/test_compare_turner.py
      - name: Validate Turner source/wall balance analysis
        run: python3 scripts/test_turner_balance.py
      - name: Validate Turner density-block analysis
        run: python3 scripts/test_turner_density_blocks.py
      - name: Validate Turner ensemble preparation
        run: python3 scripts/test_prepare_turner_ensemble.py
      - name: Validate Turner ensemble result attachment
        run: python3 scripts/test_attach_turner_ensemble_result.py
      - name: Validate Turner ensemble analysis
        run: python3 scripts/test_analyze_turner_ensemble.py
      - name: Validate Turner sensitivity preparation
        run: python3 scripts/test_prepare_turner_sensitivity.py
      - name: Validate restart-safe 1D spatial averaging
        run: python3 scripts/test_spatial_average_1d.py build/aurorapic_cli
      - name: Validate Turner spatial-structure analysis
        run: python3 scripts/test_analyze_turner_spatial_structure.py
      - name: Validate phase EEDF interchange
        run: python3 scripts/test_phase_eedf_interchange.py
      - name: Validate Hall reference normalization
        run: python3 scripts/test_normalize_hall_reference.py
      - name: Run bounded Hall micro pilot
        run: python3 scripts/test_hall_pilot.py build/aurorapic_cli
      - name: Validate bounded Hall runtime qualification
        run: python3 scripts/test_hall_runtime_qualification.py build/aurorapic_cli

      - name: Run CTest
        run: ctest --test-dir build --parallel 1 --output-on-failure

      - name: Validate pushers
        run: python3 scripts/validate_pushers.py

      - name: Validate kinetic responses
        run: |
          python3 scripts/test_kinetic_benchmarks.py
          OMP_NUM_THREADS=1 python3 scripts/validate_kinetic_benchmarks.py build/aurorapic_cli

      - name: Run example smoke tests
        run: python3 scripts/verify_examples.py build/aurorapic_cli

      - name: Verify install and TGZ package
        run: python3 scripts/verify_install_package.py build --jobs 2

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurorapic-${{ matrix.os }}-${{ matrix.compiler }}-openmp-${{ matrix.openmp }}
          path: build/AuroraPIC-*.tar.gz
          if-no-files-found: error
