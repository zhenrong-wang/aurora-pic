name: AuroraPIC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / openmp=${{ matrix.openmp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            openmp: ON
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            openmp: OFF
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
            openmp: OFF

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_ENABLE_OPENMP=${{ matrix.openmp }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Validate milestone and release metadata
        run: |
          python3 scripts/validate_milestones.py
          python3 scripts/validate_release_artifacts.py

      - name: Validate LXCat importer
        run: python3 scripts/test_import_lxcat.py

      - name: Validate electron-swarm CLI
        run: python3 scripts/test_swarm_cli.py build/aurorapic_swarm

      - name: Validate swarm reference comparison
        run: python3 scripts/test_compare_swarm.py

      - name: Run CTest
        run: ctest --test-dir build --parallel 1 --output-on-failure

      - name: Validate pushers
        run: python3 scripts/validate_pushers.py

      - name: Run example smoke tests
        run: python3 scripts/verify_examples.py build/aurorapic_cli

      - name: Verify install and TGZ package
        run: python3 scripts/verify_install_package.py build --jobs 2

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurorapic-${{ matrix.os }}-${{ matrix.compiler }}-openmp-${{ matrix.openmp }}
          path: build/AuroraPIC-*.tar.gz
          if-no-files-found: error
