# Resource-bounded 1D RF-electrode integration smoke test.
# This checks time-dependent Dirichlet field application only; it is not a
# self-sustained discharge or a Turner helium benchmark.
config_version = 1
units = normalized
dimension = 1
nx = 33
length = 1.0
dt = 0.03125
steps = 16
output_interval = 4
boundary = dirichlet
mode = transient
phi_left = 0.0
phi_right = 0.0
phi_right_amplitude = 2.0
phi_right_frequency = 1.0
phi_right_phase = 0.0
seed = 202301
runtime_backend = serial
runtime_threads = 1
output_dir = output/rf_electrode_1d

[species.electrons]
charge = -1
mass = 1
density = 1
particles = 64
thermal_velocity = 0.01
loading = quiet_start

[species.ions]
charge = 1
mass = 1000
density = 1
particles = 64
thermal_velocity = 0
loading = quiet_start
