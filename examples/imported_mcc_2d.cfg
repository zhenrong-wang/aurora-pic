# Synthetic 2D3V imported-geometry MCC software-validation case.
# The cross sections are not material data and must not be used as Ar/He/Kr/Xe.
config_version = 1
units = normalized
dimension = 2
mesh = imported
mesh_file = imported_square_v2.msh
dt = 0.05
steps = 6
mode = transient
output_interval = 1
output_dir = output/imported_mcc_2d
seed = 90210
runtime_backend = serial
runtime_threads = 1
checkpoint_output = true
checkpoint_interval = 3

[collisions]
enabled = true
model = null_collision
species = tracers
gas = synthetic_validation_gas
neutral_density = 1.0
neutral_mass = 40.0
neutral_temperature = 300.0
data_provenance = AuroraPIC synthetic software validation only
max_frequency = 2.0
max_candidates_per_particle = 16

[collision.synthetic_elastic]
type = elastic
cross_section_file = mcc_2d3v_elastic.dat

[boundary.inlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.outlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.wall]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.electrode]
field = dirichlet
potential = 0.0
particle = reflecting

[species.tracers]
charge = 0.0
mass = 1.0
weight = 1.0
particles = 64
drift_velocity_x = 1.0
drift_velocity_y = 0.0
drift_velocity_z = 0.0
thermal_velocity = 0.0
