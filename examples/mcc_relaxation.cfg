# Synthetic normalized MCC verification case. The cross sections are not
# measurements and must not be used as material data.
config_version = 1
units = normalized
nx = 32
length = 1.0
dt = 0.02
steps = 50
boundary = periodic
mode = transient
output_interval = 10
seed = 90210
output_dir = output/mcc_relaxation

[collisions]
enabled = true
model = null_collision
species = electrons
neutral_density = 5.0
max_frequency = 4.0
max_candidates_per_particle = 16

[collision.elastic]
type = elastic
cross_section_file = mcc_elastic.dat

[collision.excitation]
type = excitation
cross_section_file = mcc_excitation.dat
threshold_energy = 0.5

[species.electrons]
charge = 0.0
mass = 1.0
weight = 1.0
particles = 1000
drift_velocity = 1.5
thermal_velocity = 0.1
