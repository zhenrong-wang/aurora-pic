# Dirichlet-boundary sheath-like relaxation example with absorbing walls.
config_version = 1
units = normalized
nx = 96
length = 1.0
dt = 0.001
boundary = dirichlet
mode = steady_state
max_steps = 2000
output_interval = 20
steady_window = 10
steady_tolerance = 1e-5
phi_left = 0.0
phi_right = 0.0
seed = 7
output_dir = output/sheath_steady

[collisions]
enabled = true
frequency = 0.5
neutral_temperature_velocity = 0.03

[species]
name = electrons
charge = -1.0
mass = 1.0
weight = 0.01
particles = 3000
drift_velocity = 0.0
thermal_velocity = 0.12
init_x_min = 0.05
init_x_max = 0.95

[species]
name = ions
charge = 1.0
mass = 1836.0
weight = 0.01
particles = 3000
drift_velocity = 0.0
thermal_velocity = 0.01
init_x_min = 0.05
init_x_max = 0.95
