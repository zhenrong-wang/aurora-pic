# Integration-grade planar biased-probe chamber in normalized units.
config_version = 1
dimension = 2
mesh = imported
mesh_file = biased_probe_2d.msh
dt = 0.0001
steps = 20
max_particles_per_species = 2000
mode = transient
output_interval = 5
output_dir = output/biased_probe_2d
seed = 314159
magnetic_field_z = 0.01
vtk_output = true
particle_output = true
particle_output_interval = 10
particle_output_stride = 20
particle_sample_count = 80
checkpoint_output = true
checkpoint_interval = 20
runtime_backend = serial
runtime_threads = 1
poisson_relative_tolerance = 1e-9
poisson_absolute_tolerance = 1e-12
poisson_max_iterations = 5000

[boundary.inlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.outlet]
field = neumann
normal_derivative = 0.0
particle = absorbing

[boundary.wall]
field = neumann
normal_derivative = 0.0
particle = absorbing

[boundary.probe]
field = dirichlet
potential = 10.0
particle = absorbing

[source.electron_inlet]
species = electrons
boundary = inlet
particles_per_step = 2
normal_velocity = 50.0
tangential_velocity = 0.0
thermal_velocity = 10.0

[source.ion_inlet]
species = ions
boundary = inlet
particles_per_step = 2
normal_velocity = 10.0
tangential_velocity = 0.0
thermal_velocity = 1.0

[emission.probe_secondary_electrons]
boundary = probe
incident_species = ions
emitted_species = electrons
yield = 0.2
max_particles_per_impact = 4
normal_velocity = 20.0
tangential_velocity = 0.0
thermal_velocity = 5.0

[species.electrons]
charge = -1e-12
mass = 1e-12
weight = 1.0
particles = 400
drift_velocity_x = 50.0
drift_velocity_y = 0.0
thermal_velocity = 10.0
init_x_min = 0.005
init_x_max = 0.115
init_y_min = -0.035
init_y_max = 0.035

[species.ions]
charge = 1e-12
mass = 1.836e-9
weight = 1.0
particles = 400
drift_velocity_x = 10.0
drift_velocity_y = 0.0
thermal_velocity = 1.0
init_x_min = 0.005
init_x_max = 0.115
init_y_min = -0.035
init_y_max = 0.035
