# Synthetic normalized 1D3V multi-MCC and ionization integration case.
# These cross sections are software-validation data, not gas-property data.
config_version = 1
units = normalized
dimension = 1
velocity_dimensions = 3
nx = 32
length = 1.0
dt = 0.1
steps = 4
boundary = periodic
mode = transient
output_interval = 1
seed = 271828
runtime_backend = serial
runtime_threads = 1
max_particles_per_species = 256
checkpoint_output = true
checkpoint_interval = 2
output_dir = output/mcc_ionization_1d

[collisions.electron_mcc]
model = null_collision
species = electrons
neutral_density = 1.0
max_frequency = 3.0
max_candidates_per_particle = 16

[collisions.electron_mcc.channel.ionization]
type = ionization
cross_section_file = mcc_2d3v_ionization.dat
threshold_energy = 1.0
secondary_species = electrons
ion_species = ions

[collisions.ion_mcc]
model = null_collision
species = ions
neutral_density = 1.0
max_frequency = 0.25
max_candidates_per_particle = 16

[collisions.ion_mcc.channel.elastic]
type = elastic
cross_section_file = mcc_elastic.dat

[species.electrons]
charge = -1.0
mass = 1.0
weight = 1.0
particles = 64
drift_velocity = 4.0
thermal_velocity = 0.0
loading = quiet_start

[species.ions]
charge = 1.0
mass = 40.0
weight = 1.0
particles = 64
drift_velocity = 4.0
thermal_velocity = 0.0
loading = quiet_start
