# Electrostatic two-stream-like transient example in normalized units.
nx = 128
length = 1.0
dt = 0.002
steps = 300
output_interval = 25
boundary = periodic
mode = transient
seed = 42
output_dir = output/two_stream

[species]
name = electrons_left
charge = -1.0
mass = 1.0
weight = 0.005
particles = 4000
drift_velocity = 0.45
thermal_velocity = 0.05

[species]
name = electrons_right
charge = -1.0
mass = 1.0
weight = 0.005
particles = 4000
drift_velocity = -0.45
thermal_velocity = 0.05

[species]
name = ion_background
charge = 1.0
mass = 1836.0
weight = 0.01
particles = 4000
drift_velocity = 0.0
thermal_velocity = 0.0
