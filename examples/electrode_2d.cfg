# 2D2V electrostatic Dirichlet electrode smoke-test example in normalized units.
config_version = 1
units = normalized
dimension = 2
nx = 32
ny = 24
length_x = 1.0
length_y = 0.75
dt = 0.001
steps = 10
mode = transient
output_interval = 5
boundary = dirichlet
phi_left = -5.0
phi_right = 5.0
phi_bottom = 0.0
phi_top = 0.0
boundary_left_tag = cathode
boundary_right_tag = anode
boundary_bottom_tag = grounded_wall
boundary_top_tag = grounded_wall
# Demonstrate per-side particle boundary policies on a Dirichlet electrode domain.
# Omitted sides inherit particle_boundary; "auto" maps to absorbing for Dirichlet fields
# and periodic for periodic fields.
particle_boundary = absorbing
particle_boundary_right = reflecting
seed = 126
vtk_output = true
output_dir = output/electrode_2d

[species.electrons]
charge = -1.0
mass = 1.0
density = 40.0
particles = 80
drift_velocity_x = 0.0
drift_velocity_y = 0.0
thermal_velocity = 0.01
init_x_min = 0.2
init_x_max = 0.8
init_y_min = 0.2
init_y_max = 0.55

[species.ions]
charge = 1.0
mass = 1836.0
density = 40.0
particles = 80
drift_velocity_x = 0.0
drift_velocity_y = 0.0
thermal_velocity = 0.0
init_x_min = 0.2
init_x_max = 0.8
init_y_min = 0.2
init_y_max = 0.55
