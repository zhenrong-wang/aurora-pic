# Synthetic imported-geometry resonant charge-exchange validation case.
# The cross sections are not material data and must not be used as Ar/He/Kr/Xe.
config_version = 1
units = normalized
dimension = 2
mesh = imported
mesh_file = imported_square_v2.msh
dt = 0.05
steps = 6
mode = transient
output_interval = 1
output_dir = output/imported_charge_exchange_2d
seed = 161803
runtime_backend = serial
runtime_threads = 1
checkpoint_output = true
checkpoint_interval = 3

[collisions]
enabled = true
model = null_collision
species = ions
gas_data_file = synthetic_charge_exchange.gas
neutral_density = 1.0
neutral_temperature = 300.0
max_frequency = 2.0
max_candidates_per_particle = 16

[boundary.inlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.outlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.wall]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.electrode]
field = dirichlet
potential = 0.0
particle = reflecting

[species.ions]
charge = 1.0e-12
mass = 40.0
weight = 1.0
particles = 32
drift_velocity_x = 1.0
drift_velocity_y = 0.0
drift_velocity_z = 0.0
thermal_velocity = 0.0

[species.electrons]
charge = -1.0e-12
mass = 1.0
weight = 1.0
particles = 32
drift_velocity_x = 0.0
drift_velocity_y = 0.0
drift_velocity_z = 0.0
thermal_velocity = 0.0
