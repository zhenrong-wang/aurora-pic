# Minimal 2D2V electrostatic plasma smoke-test example in normalized units.
config_version = 1
dimension = 2
nx = 32
ny = 32
length_x = 1.0
length_y = 1.0
dt = 0.002
steps = 20
mode = transient
output_interval = 10
boundary = periodic
seed = 84
runtime_backend = serial
runtime_threads = 1
# M5 smoke coverage: prescribed uniform out-of-plane B activates the Boris pusher.
magnetic_field_z = 0.15
vtk_output = true
particle_output = true
particle_output_interval = 10
particle_output_stride = 5
particle_sample_count = 20
output_dir = output/plasma_2d

[species.electrons]
charge = -1.0
mass = 1.0
density = 100.0
particles = 100
drift_velocity_x = 0.05
drift_velocity_y = 0.0
thermal_velocity = 0.02
init_x_min = 0.0
init_x_max = 1.0
init_y_min = 0.0
init_y_max = 1.0

[species.ions]
charge = 1.0
mass = 1836.0
density = 100.0
particles = 100
drift_velocity_x = 0.0
