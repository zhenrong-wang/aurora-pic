# Imported triangle/quad 2D runtime smoke example in normalized units.
config_version = 1
units = normalized
dimension = 2
mesh = imported
mesh_file = imported_square_v2.msh
dt = 0.01
steps = 3
max_particles_per_species = 10000
mode = transient
output_interval = 1
output_dir = output/imported_plasma_2d
seed = 2026
magnetic_field_z = 0.0
vtk_output = true
particle_output = true
particle_output_interval = 1
particle_output_stride = 2
particle_sample_count = 12
checkpoint_output = true
checkpoint_interval = 3
runtime_backend = serial
runtime_threads = 1
poisson_relative_tolerance = 1e-10
poisson_absolute_tolerance = 1e-12

[boundary.inlet]
field = dirichlet
potential = 0.0
particle = reflecting

[boundary.outlet]
field = neumann
normal_derivative = 0.0
particle = absorbing

[boundary.wall]
field = neumann
normal_derivative = 0.0
particle = reflecting

[boundary.electrode]
field = neumann
normal_derivative = 0.0
particle = reflecting

[source.electron_inlet]
species = electrons
boundary = inlet
particles_per_step = 1
normal_velocity = 0.02
tangential_velocity = 0.0
thermal_velocity = 0.005

[source.ion_inlet]
species = ions
boundary = inlet
particles_per_step = 1
normal_velocity = 0.005
tangential_velocity = 0.0
thermal_velocity = 0.0

[emission.outlet_secondary_electrons]
boundary = outlet
incident_species = ions
emitted_species = electrons
yield = 0.2
max_particles_per_impact = 8
normal_velocity = 0.02
tangential_velocity = 0.0
thermal_velocity = 0.005

[species.electrons]
charge = -1.0
mass = 1.0
weight = 0.03125
particles = 32
drift_velocity_x = 0.02
drift_velocity_y = 0.0
thermal_velocity = 0.01

[species.ions]
charge = 1.0
mass = 1836.0
weight = 0.03125
particles = 32
drift_velocity_x = 0.0
drift_velocity_y = 0.0
thermal_velocity = 0.0
